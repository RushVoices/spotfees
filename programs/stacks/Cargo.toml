[package]
name = "stacks"
version = "0.1.0"
description = "Ten Stacks, one fee stream"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stacks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token"] }

[dev-dependencies]
litesvm = "0.6.1"
solana-sdk = "2.2"
spl-token = { version = "8", features = ["no-entrypoint"] }
